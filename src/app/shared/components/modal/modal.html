
<div class="modal-backdrop" *ngIf="isOpen">

  <div class="modal-content">

    <div class="modal-header">
      <h3>{{ title }}</h3>

      <button
        class="close-btn"
        (click)="close()">
        ×
      </button>
    </div>

    <div class="modal-body">
      <ng-content></ng-content>
    </div>

  </div>

</div>
